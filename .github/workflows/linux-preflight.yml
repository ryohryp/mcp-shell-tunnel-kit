name: Linux preflight tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check POSIX shell syntax
        run: |
          dash -n scripts/verify-linux-readonly.sh
          dash -n tests/test-verify-linux-readonly.sh
          dash -n scripts/verify-linux-posture.sh
          dash -n tests/test-verify-linux-posture.sh
      - name: Run offline regression tests
        run: |
          dash tests/test-verify-linux-readonly.sh
          dash tests/test-verify-linux-posture.sh
