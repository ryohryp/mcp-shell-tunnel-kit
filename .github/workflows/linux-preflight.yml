name: Linux preflight tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check POSIX shell syntax
        run: |
          dash -n scripts/verify-linux-readonly.sh
          dash -n tests/test-verify-linux-readonly.sh
          dash -n scripts/verify-linux-posture.sh
          dash -n tests/test-verify-linux-posture.sh
          dash -n scripts/install-personal-orbit-deploy-helpers.sh
          dash -n scripts/install-personal-orbit-deploy-helpers-root.sh
          dash -n tests/test-personal-orbit-helper-install.sh
          dash -n scripts/bootstrap-personal-orbit-note-relay.sh
          dash -n scripts/bootstrap-personal-orbit-note-relay-root.sh
          dash -n tests/test-personal-orbit-note-relay-bootstrap.sh
      - name: Run offline regression tests
        run: |
          dash tests/test-verify-linux-readonly.sh
          dash tests/test-verify-linux-posture.sh
          dash tests/test-personal-orbit-helper-install.sh
          dash tests/test-personal-orbit-note-relay-bootstrap.sh
      - name: Run Sites control-plane tests
        run: npm test --prefix sites_mcp
      - name: Run browser policy tests
        run: |
          npm run check --prefix browser_mcp
          npm test --prefix browser_mcp
